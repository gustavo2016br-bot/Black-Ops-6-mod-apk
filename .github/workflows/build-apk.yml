name: Build ControllerX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ============================================================
      # REPOSITÓRIO
      # ============================================================

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          # Necessário porque o payload original do ControllerX
          # está guardado em um commit anterior.
          fetch-depth: 0


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # MANTER A MESMA CHAVE DEBUG ENTRE BUILDS FUTURAS
      # ============================================================

      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: controllerx-android-debug-keystore-v1


      # ============================================================
      # DEPENDÊNCIAS NATIVAS
      # ============================================================

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            protobuf-compiler \
            python3-protobuf \
            python3 \
            git \
            unzip \
            zip \
            ninja-build \
            binutils

          echo
          echo "========================================"
          echo " protoc"
          echo "========================================"

          protoc --version

          echo
          echo "========================================"
          echo " Python protobuf"
          echo "========================================"

          python3 - <<'PY'
          import google.protobuf
          print("protobuf Python OK:", google.protobuf.__version__)
          PY

          echo
          echo "========================================"
          echo " readelf"
          echo "========================================"

          readelf --version | head -1


      # ============================================================
      # ANDROID SDK / NDK / CMAKE
      # ============================================================

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

          echo
          echo "========================================"
          echo " Android SDK"
          echo "========================================"

          echo "$ANDROID_HOME"

          echo
          echo "========================================"
          echo " CMake"
          echo "========================================"

          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version

          echo
          echo "========================================"
          echo " Android NDK clang"
          echo "========================================"

          "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version


      # ============================================================
      # CHIAKI ANDROID
      # ============================================================

      - name: Clone pinned Chiaki Android base
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive \
            https://github.com/SalamiTheMan/chiaki-ng-android-extended.git \
            upstream

          cd upstream

          git checkout \
            478a20eab9e55651ae77035764cf3138bd14084b

          git submodule update \
            --init \
            --recursive

          echo
          echo "========================================"
          echo " Chiaki commit"
          echo "========================================"

          git rev-parse HEAD


      # ============================================================
      # RECUPERAR O PATCH COMPLETO CONTROLLERX
      # ============================================================

      - name: Restore ControllerX v3.2 PRO MODS patch
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD_COMMIT="6ff6a84c8629c138e4f6035798d7033f1268238d"

          echo
          echo "========================================"
          echo " Recuperando ControllerX"
          echo "========================================"

          echo "Commit:"
          echo "$PAYLOAD_COMMIT"

          git show \
            "${PAYLOAD_COMMIT}:.github/workflows/build-apk.yml" \
            > /tmp/controllerx-old-workflow.yml

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "/tmp/controllerx-old-workflow.yml"
          ).read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          start = None
          end = None

          marker = (
              "cat > /tmp/controllerx_patch.gz.b64 "
              "<<'CONTROLLERX_B64'"
          )

          for i, line in enumerate(lines):
              if marker in line:
                  start = i + 1
                  break

          if start is None:
              raise SystemExit(
                  "ERRO: inicio do payload "
                  "CONTROLLERX_B64 nao encontrado."
              )

          for i in range(start, len(lines)):
              if lines[i].strip() == "CONTROLLERX_B64":
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "ERRO: final do payload "
                  "CONTROLLERX_B64 nao encontrado."
              )

          payload_lines = [
              line.strip()
              for line in lines[start:end]
              if line.strip()
          ]

          payload = "\n".join(payload_lines) + "\n"

          output = Path(
              "/tmp/controllerx_patch.gz.b64"
          )

          output.write_text(
              payload,
              encoding="utf-8"
          )

          print(
              "Payload ControllerX recuperado:",
              len(payload_lines),
              "linhas"
          )
          PY

          echo
          echo "========================================"
          echo " Validando payload"
          echo "========================================"

          base64 -d \
            /tmp/controllerx_patch.gz.b64 \
            > /tmp/controllerx_patch.gz

          gzip -t \
            /tmp/controllerx_patch.gz

          gzip -dc \
            /tmp/controllerx_patch.gz \
            > /tmp/apply_controllerx_android.py

          echo
          echo "========================================"
          echo " Aplicando ControllerX"
          echo "========================================"

          cd upstream

          python3 \
            /tmp/apply_controllerx_android.py

          echo
          echo "ControllerX patch aplicado com sucesso."


      # ============================================================
      # FIX DO OBOE ANTIGO PARA NDK 26
      # ============================================================

      - name: Fix old Oboe for Android NDK 26
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "android/app/src/main/cpp/oboe/src"
          )

          if not root.exists():
              raise SystemExit(
                  "ERRO: pasta Oboe nao encontrada: "
                  + str(root)
              )

          patched = []

          for path in root.rglob("*.cpp"):

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if "assert(" not in text:
                  continue

              if "#include <cassert>" in text:
                  continue

              new_text = (
                  "#include <cassert>\n"
                  + text
              )

              path.write_text(
                  new_text,
                  encoding="utf-8"
              )

              patched.append(
                  str(path)
              )

          print(
              "Arquivos Oboe corrigidos:",
              len(patched)
          )

          for path in patched:
              print(
                  "  +",
                  path
              )
          PY

          echo
          echo "========================================"
          echo " Verificando Oboe"
          echo "========================================"

          for FILE in \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResampler.cpp \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResamplerMono.cpp \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResamplerStereo.cpp
          do
            if [ -f "$FILE" ]; then

              echo
              echo "----- $FILE -----"

              grep -n \
                -E '#include <cassert>|assert\(' \
                "$FILE" \
                | head -20

            fi
          done


      # ============================================================
      # ANDROID 15 / 16
      # FIX DE BIBLIOTECA NATIVA E PÁGINAS DE 16 KB
      # ============================================================

      - name: Fix Android 15 and 16 native library compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          python3 - <<'PY'
          from pathlib import Path


          # ========================================================
          # CMAKE
          # ========================================================

          cmake = Path(
              "android/app/CMakeLists.txt"
          )

          cmake_text = cmake.read_text(
              encoding="utf-8"
          )

          marker = (
              "# ControllerX Android 16KB compatibility"
          )

          if marker not in cmake_text:

              block = r'''

          # ControllerX Android 16KB compatibility
          #
          # Android 15/16 pode usar páginas de memória de 16 KB.
          # A biblioteca nativa precisa ter segmentos LOAD
          # compatíveis.

          target_link_options(
              chiaki-jni
              PRIVATE
              "-Wl,-z,max-page-size=16384"
          )
          '''

              cmake_text += block

              cmake.write_text(
                  cmake_text,
                  encoding="utf-8"
              )

              print(
                  "CMake linker 16KB adicionado."
              )

          else:
              print(
                  "CMake linker 16KB ja presente."
              )


          # ========================================================
          # GRADLE
          #
          # Faz a lib nativa ser extraída durante a instalação.
          # Isso evita depender de mmap direto do .so dentro do APK.
          # ========================================================

          gradle = Path(
              "android/app/build.gradle"
          )

          gradle_text = gradle.read_text(
              encoding="utf-8"
          )

          if "useLegacyPackaging = true" not in gradle_text:

              gradle_marker = '''    buildFeatures {
          '''

              gradle_block = '''    packaging {
              jniLibs {
                  useLegacyPackaging = true
              }
          }

          '''

              if gradle_marker not in gradle_text:
                  raise SystemExit(
                      "ERRO: buildFeatures nao encontrado "
                      "em android/app/build.gradle."
                  )

              gradle_text = gradle_text.replace(
                  gradle_marker,
                  gradle_block + gradle_marker,
                  1
              )

              gradle.write_text(
                  gradle_text,
                  encoding="utf-8"
              )

              print(
                  "Legacy JNI packaging adicionado."
              )

          else:
              print(
                  "Legacy JNI packaging ja presente."
              )


          # ========================================================
          # MANIFEST
          # ========================================================

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest_text = manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:extractNativeLibs="true"'
              not in manifest_text
          ):

              app_marker = '''    <application
          '''

              replacement = '''    <application
              android:extractNativeLibs="true"
          '''

              if app_marker not in manifest_text:
                  raise SystemExit(
                      "ERRO: <application> nao encontrado "
                      "no AndroidManifest.xml."
                  )

              manifest_text = manifest_text.replace(
                  app_marker,
                  replacement,
                  1
              )

              manifest.write_text(
                  manifest_text,
                  encoding="utf-8"
              )

              print(
                  "extractNativeLibs=true adicionado."
              )

          else:
              print(
                  "extractNativeLibs=true ja presente."
              )
          PY

          echo
          echo "========================================"
          echo " Verificando fix Android 15/16"
          echo "========================================"

          grep -n \
            "max-page-size" \
            android/app/CMakeLists.txt

          echo

          grep -n \
            -A5 \
            "packaging {" \
            android/app/build.gradle

          echo

          grep -n \
            "extractNativeLibs" \
            android/app/src/main/AndroidManifest.xml

          cd ..

          git -C upstream diff -- . \
            > controllerx-patched-source.diff


      # ============================================================
      # LIMPAR CACHE NATIVO
      # ============================================================

      - name: Clean stale Android native build cache
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            upstream/android/app/.cxx

          rm -rf \
            upstream/android/app/build/intermediates/cxx

          echo
          echo "Cache CMake antigo removido."


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd upstream/android

          chmod +x gradlew

          echo
          echo "========================================"
          echo " Gradle"
          echo "========================================"

          ./gradlew --version

          echo
          echo "========================================"
          echo " Compilando ControllerX"
          echo "========================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            2>&1 \
            | tee \
            ../../controllerx-android-build.log


      # ============================================================
      # VALIDAR O APK ANTES DE ENTREGAR
      # ============================================================

      - name: Validate ControllerX APK
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo
          echo "========================================"
          echo " APK encontrado"
          echo "========================================"

          ls -lh "$APK"

          rm -rf /tmp/controllerx-apk-check

          mkdir -p \
            /tmp/controllerx-apk-check

          unzip -p \
            "$APK" \
            lib/arm64-v8a/libchiaki-jni.so \
            > /tmp/controllerx-apk-check/libchiaki-jni.so

          if [ ! -s \
            /tmp/controllerx-apk-check/libchiaki-jni.so \
          ]; then

            echo
            echo "ERRO: libchiaki-jni.so ARM64 nao encontrada."

            exit 1
          fi

          echo
          echo "========================================"
          echo " ELF ARM64"
          echo "========================================"

          readelf -lW \
            /tmp/controllerx-apk-check/libchiaki-jni.so \
            | tee \
            controllerx-readelf-arm64.txt

          echo
          echo "========================================"
          echo " Alinhamento dos segmentos LOAD"
          echo "========================================"

          mapfile -t LOAD_ALIGNMENTS < <(
            readelf -lW \
              /tmp/controllerx-apk-check/libchiaki-jni.so \
              | awk '$1 == "LOAD" {print $NF}'
          )

          if [ "${#LOAD_ALIGNMENTS[@]}" -eq 0 ]; then

            echo "ERRO: nenhum segmento LOAD encontrado."

            exit 1
          fi

          for ALIGN in "${LOAD_ALIGNMENTS[@]}"
          do

            echo "LOAD alignment: $ALIGN"

            ALIGN_DEC=$((ALIGN))

            if [ "$ALIGN_DEC" -lt 16384 ]; then

              echo
              echo "ERRO:"
              echo "Biblioteca ARM64 ainda possui"
              echo "segmento abaixo de 16 KB."

              exit 1
            fi

          done

          echo
          echo "========================================"
          echo " 16 KB ELF: OK"
          echo "========================================"

          echo
          echo "========================================"
          echo " APK JNI entry"
          echo "========================================"

          unzip -lv \
            "$APK" \
            | grep \
            "lib/arm64-v8a/libchiaki-jni.so" \
            | tee \
            controllerx-apk-jni-entry.txt

          echo
          echo "APK passou na verificacao nativa."


      # ============================================================
      # PREPARAR ARTEFATO
      # ============================================================

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          cp \
            "$APK" \
            ControllerX-Android-v3.2-PRO-MODS-ANDROID16.apk

          sha256sum \
            ControllerX-Android-v3.2-PRO-MODS-ANDROID16.apk \
            | tee \
            ControllerX-Android-v3.2-PRO-MODS-ANDROID16.sha256

          echo
          echo "========================================"
          echo " APK FINAL GERADO"
          echo "========================================"

          ls -lh \
            ControllerX-Android-v3.2-PRO-MODS-ANDROID16.apk


      # ============================================================
      # UPLOAD DO APK
      # ============================================================

      - name: Upload ControllerX APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-APK
          path: |
            ControllerX-Android-v3.2-PRO-MODS-ANDROID16.apk
            ControllerX-Android-v3.2-PRO-MODS-ANDROID16.sha256
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # DIAGNÓSTICOS
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-build-diagnostics
          path: |
            controllerx-android-build.log
            controllerx-patched-source.diff
            controllerx-readelf-arm64.txt
            controllerx-apk-jni-entry.txt
          if-no-files-found: ignore
          retention-days: 14
