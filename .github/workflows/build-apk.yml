      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd upstream/android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee ../../controllerx-android-build.log

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="upstream/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" ControllerX-Android-v3.2-PRO-MODS-debug.apk
          sha256sum ControllerX-Android-v3.2-PRO-MODS-debug.apk | tee ControllerX-Android-v3.2-PRO-MODS-debug.sha256

      - name: Upload ControllerX APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-APK
          path: |
            ControllerX-Android-v3.2-PRO-MODS-debug.apk
            ControllerX-Android-v3.2-PRO-MODS-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-build-diagnostics
          path: |
            controllerx-android-build.log
            controllerx-patched-source.diff
          if-no-files-found: ignore
          retention-days: 14
