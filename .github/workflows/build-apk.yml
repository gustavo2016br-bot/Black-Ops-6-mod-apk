name: Build ControllerX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          # Precisamos do histórico porque o payload grande do
          # ControllerX está salvo no commit anterior.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            protobuf-compiler \
            python3-protobuf \
            python3 \
            git \
            unzip \
            ninja-build

          echo "===== protoc ====="
          protoc --version

          echo "===== Python protobuf ====="
          python3 - <<'PY'
          import google.protobuf
          print("protobuf Python OK:", google.protobuf.__version__)
          PY

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

          echo "===== Android SDK ====="
          echo "$ANDROID_HOME"

          echo "===== CMake ====="
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version

          echo "===== NDK clang ====="
          "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Clone pinned Chiaki Android base
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive \
            https://github.com/SalamiTheMan/chiaki-ng-android-extended.git \
            upstream

          cd upstream

          git checkout 478a20eab9e55651ae77035764cf3138bd14084b

          git submodule update --init --recursive

          echo "===== Chiaki commit ====="
          git rev-parse HEAD

      - name: Restore ControllerX v3.2 PRO MODS patch
        shell: bash
        run: |
          set -euo pipefail

          # Esse é o commit da build #2 que contém o payload completo
          # do ControllerX dentro do workflow anterior.
          PAYLOAD_COMMIT="6ff6a84c8629c138e4f6035798d7033f1268238d"

          echo "Recuperando payload ControllerX do commit:"
          echo "$PAYLOAD_COMMIT"

          git show \
            "${PAYLOAD_COMMIT}:.github/workflows/build-apk.yml" \
            > /tmp/controllerx-old-workflow.yml

          python3 - <<'PY'
          from pathlib import Path

          source = Path("/tmp/controllerx-old-workflow.yml").read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          start = None
          end = None

          for i, line in enumerate(lines):
              if "cat > /tmp/controllerx_patch.gz.b64 <<'CONTROLLERX_B64'" in line:
                  start = i + 1
                  break

          if start is None:
              raise SystemExit(
                  "ERRO: inicio do payload CONTROLLERX_B64 nao encontrado."
              )

          for i in range(start, len(lines)):
              if lines[i].strip() == "CONTROLLERX_B64":
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "ERRO: fim do payload CONTROLLERX_B64 nao encontrado."
              )

          # As linhas do base64 só possuem o conteúdo + indentação YAML.
          payload_lines = [
              line.strip()
              for line in lines[start:end]
              if line.strip()
          ]

          payload = "\n".join(payload_lines) + "\n"

          Path("/tmp/controllerx_patch.gz.b64").write_text(
              payload,
              encoding="utf-8"
          )

          print(
              "Payload ControllerX recuperado:",
              len(payload_lines),
              "linhas"
          )
          PY

          echo "===== Validando base64/gzip ====="

          base64 -d \
            /tmp/controllerx_patch.gz.b64 \
            > /tmp/controllerx_patch.gz

          gzip -t /tmp/controllerx_patch.gz

          gzip -dc \
            /tmp/controllerx_patch.gz \
            > /tmp/apply_controllerx_android.py

          echo "===== Aplicando ControllerX ====="

          cd upstream

          python3 /tmp/apply_controllerx_android.py

          echo "ControllerX patch aplicado."

      - name: Fix old Oboe for Android NDK 26
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "android/app/src/main/cpp/oboe/src"
          )

          if not root.exists():
              raise SystemExit(
                  f"ERRO: pasta Oboe nao encontrada: {root}"
              )

          patched = []

          for path in root.rglob("*.cpp"):
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              # O Oboe antigo utiliza assert() em alguns arquivos,
              # mas não inclui <cassert>. Com o NDK 26 isso falha.
              if "assert(" not in text:
                  continue

              if "#include <cassert>" in text:
                  continue

              new_text = "#include <cassert>\n" + text

              path.write_text(
                  new_text,
                  encoding="utf-8"
              )

              patched.append(str(path))

          print("Arquivos Oboe corrigidos:")

          for path in patched:
              print("  +", path)

          if not patched:
              print(
                  "Nenhum arquivo precisou de patch "
                  "(possivelmente ja corrigido)."
              )
          PY

          echo "===== Verificando PolyphaseResampler ====="

          for FILE in \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResampler.cpp \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResamplerMono.cpp \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResamplerStereo.cpp
          do
            if [ -f "$FILE" ]; then
              echo
              echo "----- $FILE -----"

              grep -n \
                -E '#include <cassert>|assert\(' \
                "$FILE" \
                | head -20
            fi
          done

          cd ..

          git -C upstream diff -- . \
            > controllerx-patched-source.diff

      - name: Clean stale Android native build cache
        shell: bash
        run: |
          set -euo pipefail

          rm -rf upstream/android/app/.cxx
          rm -rf upstream/android/app/build/intermediates/cxx

          echo "Native CMake cache removido."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd upstream/android

          chmod +x gradlew

          echo "===== Gradle version ====="
          ./gradlew --version

          echo "===== Building ControllerX APK ====="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            2>&1 \
            | tee ../../controllerx-android-build.log

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "Procurando APK em:"
          echo "$APK"

          test -f "$APK"

          cp \
            "$APK" \
            ControllerX-Android-v3.2-PRO-MODS-debug.apk

          sha256sum \
            ControllerX-Android-v3.2-PRO-MODS-debug.apk \
            | tee \
            ControllerX-Android-v3.2-PRO-MODS-debug.sha256

          echo
          echo "===== APK GERADO ====="

          ls -lh \
            ControllerX-Android-v3.2-PRO-MODS-debug.apk

      - name: Upload ControllerX APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-APK
          path: |
            ControllerX-Android-v3.2-PRO-MODS-debug.apk
            ControllerX-Android-v3.2-PRO-MODS-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-build-diagnostics
          path: |
            controllerx-android-build.log
            controllerx-patched-source.diff
          if-no-files-found: ignore
          retention-days: 14
