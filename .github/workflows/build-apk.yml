name: Build ControllerX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # DEBUG KEY
      # ============================================================

      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: controllerx-android-debug-keystore-v1


      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            protobuf-compiler \
            python3-protobuf \
            python3 \
            git \
            unzip \
            zip \
            ninja-build \
            binutils

          echo "========================================"
          echo "PROTOC"
          echo "========================================"

          protoc --version

          echo "========================================"
          echo "PYTHON PROTOBUF"
          echo "========================================"

          python3 - <<'PY'
          import google.protobuf
          print("protobuf Python OK:", google.protobuf.__version__)
          PY

          echo "========================================"
          echo "READELF"
          echo "========================================"

          readelf --version | head -1


      # ============================================================
      # ANDROID SDK / NDK / CMAKE
      # ============================================================

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "$ANDROID_HOME"

          echo "========================================"
          echo "CMAKE"
          echo "========================================"

          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            --version

          echo "========================================"
          echo "NDK CLANG"
          echo "========================================"

          "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version


      # ============================================================
      # CHIAKI ANDROID
      # ============================================================

      - name: Clone pinned Chiaki Android base
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive \
            https://github.com/SalamiTheMan/chiaki-ng-android-extended.git \
            upstream

          cd upstream

          git checkout \
            478a20eab9e55651ae77035764cf3138bd14084b

          git submodule update \
            --init \
            --recursive

          echo "========================================"
          echo "CHIAKI COMMIT"
          echo "========================================"

          git rev-parse HEAD


      # ============================================================
      # RESTAURAR CONTROLLERX
      # ============================================================

      - name: Restore ControllerX v3.2 PRO MODS patch
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD_COMMIT="6ff6a84c8629c138e4f6035798d7033f1268238d"

          echo "========================================"
          echo "RECUPERANDO CONTROLLERX"
          echo "========================================"

          echo "$PAYLOAD_COMMIT"

          git show \
            "${PAYLOAD_COMMIT}:.github/workflows/build-apk.yml" \
            > /tmp/controllerx-old-workflow.yml

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "/tmp/controllerx-old-workflow.yml"
          ).read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          start = None
          end = None

          marker = (
              "cat > /tmp/controllerx_patch.gz.b64 "
              "<<'CONTROLLERX_B64'"
          )

          for i, line in enumerate(lines):
              if marker in line:
                  start = i + 1
                  break

          if start is None:
              raise SystemExit(
                  "ERRO: inicio CONTROLLERX_B64 "
                  "nao encontrado."
              )

          for i in range(start, len(lines)):
              if lines[i].strip() == "CONTROLLERX_B64":
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "ERRO: fim CONTROLLERX_B64 "
                  "nao encontrado."
              )

          payload_lines = [
              line.strip()
              for line in lines[start:end]
              if line.strip()
          ]

          payload = "\n".join(
              payload_lines
          ) + "\n"

          Path(
              "/tmp/controllerx_patch.gz.b64"
          ).write_text(
              payload,
              encoding="utf-8"
          )

          print(
              "Payload recuperado:",
              len(payload_lines),
              "linhas"
          )
          PY

          base64 -d \
            /tmp/controllerx_patch.gz.b64 \
            > /tmp/controllerx_patch.gz

          gzip -t \
            /tmp/controllerx_patch.gz

          gzip -dc \
            /tmp/controllerx_patch.gz \
            > /tmp/apply_controllerx_android.py

          cd upstream

          python3 \
            /tmp/apply_controllerx_android.py

          echo "ControllerX aplicado."


      # ============================================================
      # SAFE BOOT
      # ============================================================

      - name: Apply ControllerX Android Safe Boot
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET


          # ========================================================
          # 1 - DISCOVERY DESLIGADO POR PADRAO
          # ========================================================

          prefs = Path(
              "android/app/src/main/java/"
              "com/metallic/chiaki/common/Preferences.kt"
          )

          if not prefs.exists():
              raise SystemExit(
                  "Preferences.kt nao encontrado."
              )

          text = prefs.read_text(
              encoding="utf-8"
          )

          old = (
              "get() = sharedPreferences."
              "getBoolean(discoveryEnabledKey, true)"
          )

          new = (
              "get() = sharedPreferences."
              "getBoolean(discoveryEnabledKey, false)"
          )

          if old in text:
              text = text.replace(
                  old,
                  new
              )

          if new not in text:
              raise SystemExit(
                  "Nao foi possivel corrigir "
                  "discoveryEnabled."
              )

          prefs.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Discovery default OFF: OK"
          )


          # ========================================================
          # 2 - GARANTIR DISCOVERY OFF AO CRIAR VIEWMODEL
          # ========================================================

          vm = Path(
              "android/app/src/main/java/"
              "com/metallic/chiaki/main/"
              "MainViewModel.kt"
          )

          if not vm.exists():
              raise SystemExit(
                  "MainViewModel.kt nao encontrado."
              )

          text = vm.read_text(
              encoding="utf-8"
          )

          original = (
              "it.active = preferences.discoveryEnabled"
          )

          replacement = (
              "preferences.discoveryEnabled = false\n"
              "\t\tit.active = false"
          )

          if original in text:
              text = text.replace(
                  original,
                  replacement,
                  1
              )

          if "it.active = false" not in text:
              raise SystemExit(
                  "Nao foi possivel desativar "
                  "Discovery no MainViewModel."
              )

          vm.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "MainViewModel Safe Boot: OK"
          )


          # ========================================================
          # 3 - NÃO INICIAR DISCOVERY EM onStart
          # ========================================================

          main = Path(
              "android/app/src/main/java/"
              "com/metallic/chiaki/main/"
              "MainActivity.kt"
          )

          if not main.exists():
              raise SystemExit(
                  "MainActivity.kt nao encontrado."
              )

          text = main.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "viewModel.discoveryManager.resume()",
              "// ControllerX Safe Boot: "
              "Discovery desativado"
          )

          text = text.replace(
              "viewModel.discoveryManager.pause()",
              "// ControllerX Safe Boot: "
              "Discovery permanece desativado"
          )

          discovery_menu = (
              "discoveryMenuItem = discoveryItem"
          )

          if (
              discovery_menu in text
              and
              "discoveryItem.isVisible = false"
              not in text
          ):

              text = text.replace(
                  discovery_menu,
                  discovery_menu +
                  "\n\t\tdiscoveryItem.isVisible = false",
                  1
              )

          main.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "MainActivity Discovery bloqueado: OK"
          )


          # ========================================================
          # 4 - CRIAR SAFE BOOT ACTIVITY
          #
          # Essa Activity NAO usa ChiakiNative.
          # Ela abre antes de MainActivity.
          # ========================================================

          safe_dir = Path(
              "android/app/src/main/java/"
              "com/metallic/chiaki/safeboot"
          )

          safe_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          safe_activity = (
              safe_dir /
              "SafeBootActivity.kt"
          )

          safe_activity.write_text(
          r'''package com.metallic.chiaki.safeboot

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.preference.PreferenceManager
          import com.metallic.chiaki.R
          import com.metallic.chiaki.main.MainActivity

          class SafeBootActivity : Activity()
          {
              override fun onCreate(savedInstanceState: Bundle?)
              {
                  super.onCreate(savedInstanceState)

                  forceDiscoveryOff()

                  window.statusBarColor =
                      Color.rgb(12, 8, 20)

                  window.navigationBarColor =
                      Color.rgb(12, 8, 20)

                  val density =
                      resources.displayMetrics.density

                  fun dp(value: Int): Int
                  {
                      return (value * density).toInt()
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL

                      gravity = Gravity.CENTER

                      setPadding(
                          dp(28),
                          dp(28),
                          dp(28),
                          dp(28)
                      )

                      setBackgroundColor(
                          Color.rgb(
                              12,
                              8,
                              20
                          )
                      )
                  }

                  val title = TextView(this).apply {
                      text = "ControllerX"

                      textSize = 30f

                      setTextColor(
                          Color.rgb(
                              190,
                              120,
                              255
                          )
                      )

                      gravity = Gravity.CENTER
                  }

                  val subtitle = TextView(this).apply {
                      text =
                          "Android Safe Boot\n" +
                          "Remote Play • ControllerX"

                      textSize = 16f

                      setTextColor(
                          Color.rgb(
                              220,
                              220,
                              225
                          )
                      )

                      gravity = Gravity.CENTER

                      setPadding(
                          0,
                          dp(14),
                          0,
                          dp(30)
                      )
                  }

                  val info = TextView(this).apply {
                      text =
                          "Inicialização segura ativa.\n" +
                          "A descoberta automática do PS5 " +
                          "está desativada para evitar " +
                          "falha durante a abertura."

                      textSize = 14f

                      setTextColor(
                          Color.rgb(
                              175,
                              175,
                              185
                          )
                      )

                      gravity = Gravity.CENTER

                      setPadding(
                          0,
                          0,
                          0,
                          dp(28)
                      )
                  }

                  val openButton = Button(this).apply {
                      text = "ABRIR CONTROLLERX"

                      textSize = 16f

                      setOnClickListener {

                          forceDiscoveryOff()

                          val intent = Intent(
                              this@SafeBootActivity,
                              MainActivity::class.java
                          )

                          startActivity(intent)
                      }
                  }

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      subtitle,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      info,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      openButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(58)
                      )
                  )

                  setContentView(root)
              }


              private fun forceDiscoveryOff()
              {
                  try
                  {
                      val prefs =
                          PreferenceManager
                              .getDefaultSharedPreferences(this)

                      val key =
                          getString(
                              R.string
                                  .preferences_discovery_enabled_key
                          )

                      prefs
                          .edit()
                          .putBoolean(
                              key,
                              false
                          )
                          .commit()
                  }
                  catch(_: Throwable)
                  {
                      // Safe Boot deve continuar mesmo
                      // se a preferência falhar.
                  }
              }
          }
          ''',
              encoding="utf-8"
          )

          print(
              "SafeBootActivity criada: OK"
          )


          # ========================================================
          # 5 - SAFE BOOT PASSA A SER O LAUNCHER
          # ========================================================

          manifest_path = Path(
              "android/app/src/main/"
              "AndroidManifest.xml"
          )

          ANDROID_NS = (
              "http://schemas.android.com/apk/res/android"
          )

          TOOLS_NS = (
              "http://schemas.android.com/tools"
          )

          ET.register_namespace(
              "android",
              ANDROID_NS
          )

          ET.register_namespace(
              "tools",
              TOOLS_NS
          )

          tree = ET.parse(
              manifest_path
          )

          root = tree.getroot()

          application = root.find(
              "application"
          )

          if application is None:
              raise SystemExit(
                  "Application nao encontrada "
                  "no Manifest."
              )

          name_attr = (
              "{" +
              ANDROID_NS +
              "}name"
          )

          exported_attr = (
              "{" +
              ANDROID_NS +
              "}exported"
          )

          theme_attr = (
              "{" +
              ANDROID_NS +
              "}theme"
          )

          launcher_removed = False


          # Remove MAIN/LAUNCHER da MainActivity
          for activity in application.findall(
              "activity"
          ):

              if (
                  activity.get(name_attr)
                  != ".main.MainActivity"
              ):
                  continue

              for intent_filter in list(
                  activity.findall(
                      "intent-filter"
                  )
              ):

                  has_main = False
                  has_launcher = False

                  for action in intent_filter.findall(
                      "action"
                  ):

                      if (
                          action.get(name_attr)
                          ==
                          "android.intent.action.MAIN"
                      ):
                          has_main = True

                  for category in intent_filter.findall(
                      "category"
                  ):

                      if (
                          category.get(name_attr)
                          ==
                          "android.intent.category.LAUNCHER"
                      ):
                          has_launcher = True

                  if has_main and has_launcher:

                      activity.remove(
                          intent_filter
                      )

                      launcher_removed = True


          # Remove SafeBoot antiga se existir
          for activity in list(
              application.findall(
                  "activity"
              )
          ):

              if (
                  activity.get(name_attr)
                  ==
                  ".safeboot.SafeBootActivity"
              ):

                  application.remove(
                      activity
                  )


          # Cria nova SafeBootActivity
          safe = ET.Element(
              "activity"
          )

          safe.set(
              name_attr,
              ".safeboot.SafeBootActivity"
          )

          safe.set(
              exported_attr,
              "true"
          )

          safe.set(
              theme_attr,
              "@style/AppTheme"
          )

          intent_filter = ET.SubElement(
              safe,
              "intent-filter"
          )

          action = ET.SubElement(
              intent_filter,
              "action"
          )

          action.set(
              name_attr,
              "android.intent.action.MAIN"
          )

          category = ET.SubElement(
              intent_filter,
              "category"
          )

          category.set(
              name_attr,
              "android.intent.category.LAUNCHER"
          )

          application.insert(
              0,
              safe
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          if not launcher_removed:
              print(
                  "AVISO: launcher antigo "
                  "nao foi encontrado."
              )

          print(
              "Safe Boot launcher: OK"
          )
          PY

      - name: Fix ControllerX MainActivity startup crash
        shell: bash
        run: |
          set -euo pipefail

          cat > upstream/android/app/src/main/java/com/metallic/chiaki/main/MainActivity.kt <<'KOTLIN'
          package com.metallic.chiaki.main

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          import com.metallic.chiaki.common.ManualHostAndRegisteredHost
          import com.metallic.chiaki.common.Preferences
          import com.metallic.chiaki.common.getDatabase
          import com.metallic.chiaki.lib.ConnectInfo
          import com.metallic.chiaki.manualconsole.EditManualConsoleActivity
          import com.metallic.chiaki.regist.RegistActivity
          import com.metallic.chiaki.settings.SettingsActivity
          import com.metallic.chiaki.stream.StreamActivity


          class MainActivity : Activity()
          {
              private lateinit var root: LinearLayout
              private lateinit var consoleContainer: LinearLayout
              private lateinit var statusText: TextView

              private val density: Float
                  get() = resources.displayMetrics.density


              override fun onCreate(savedInstanceState: Bundle?)
              {
                  super.onCreate(savedInstanceState)

                  try
                  {
                      buildSafeInterface()
                  }
                  catch(t: Throwable)
                  {
                      showEmergencyScreen(t)
                  }
              }


              override fun onResume()
              {
                  super.onResume()

                  if(::consoleContainer.isInitialized)
                  {
                      loadConsolesSafely()
                  }
              }


              private fun dp(value: Int): Int
              {
                  return (value * density).toInt()
              }


              private fun buildSafeInterface()
              {
                  window.statusBarColor =
                      Color.rgb(10, 7, 16)

                  window.navigationBarColor =
                      Color.rgb(10, 7, 16)


                  val scroll = ScrollView(this).apply {

                      setBackgroundColor(
                          Color.rgb(
                              10,
                              7,
                              16
                          )
                      )
                  }


                  root = LinearLayout(this).apply {

                      orientation =
                          LinearLayout.VERTICAL

                      setPadding(
                          dp(22),
                          dp(28),
                          dp(22),
                          dp(30)
                      )
                  }


                  val title = TextView(this).apply {

                      text =
                          "ControllerX"

                      textSize = 30f

                      setTextColor(
                          Color.rgb(
                              190,
                              105,
                              255
                          )
                      )

                      gravity =
                          Gravity.CENTER_HORIZONTAL
                  }


                  val subtitle = TextView(this).apply {

                      text =
                          "PS5 • Remote Play • PRO MODS"

                      textSize = 14f

                      setTextColor(
                          Color.rgb(
                              205,
                              205,
                              215
                          )
                      )

                      gravity =
                          Gravity.CENTER_HORIZONTAL

                      setPadding(
                          0,
                          dp(8),
                          0,
                          dp(25)
                      )
                  }


                  statusText = TextView(this).apply {

                      text =
                          "ControllerX iniciado com segurança."

                      textSize = 14f

                      setTextColor(
                          Color.rgb(
                              150,
                              230,
                              170
                          )
                      )

                      setPadding(
                          dp(12),
                          dp(12),
                          dp(12),
                          dp(18)
                      )
                  }


                  val addConsoleButton =
                      createButton(
                          "ADICIONAR PS5 POR IP"
                      ) {

                          try
                          {
                              startActivity(
                                  Intent(
                                      this,
                                      EditManualConsoleActivity::class.java
                                  )
                              )
                          }
                          catch(t: Throwable)
                          {
                              showError(
                                  "Adicionar console",
                                  t
                              )
                          }
                      }


                  val registerButton =
                      createButton(
                          "REGISTRAR PS5"
                      ) {

                          try
                          {
                              startActivity(
                                  Intent(
                                      this,
                                      RegistActivity::class.java
                                  )
                              )
                          }
                          catch(t: Throwable)
                          {
                              showError(
                                  "Registrar PS5",
                                  t
                              )
                          }
                      }


                  val settingsButton =
                      createButton(
                          "CONFIGURAÇÕES / MODS"
                      ) {

                          try
                          {
                              startActivity(
                                  Intent(
                                      this,
                                      SettingsActivity::class.java
                                  )
                              )
                          }
                          catch(t: Throwable)
                          {
                              showError(
                                  "Configurações",
                                  t
                              )
                          }
                      }


                  val refreshButton =
                      createButton(
                          "ATUALIZAR CONSOLES"
                      ) {

                          loadConsolesSafely()
                      }


                  val consoleTitle =
                      TextView(this).apply {

                          text =
                              "CONSOLES"

                          textSize = 18f

                          setTextColor(
                              Color.WHITE
                          )

                          setPadding(
                              dp(8),
                              dp(24),
                              dp(8),
                              dp(12)
                          )
                      }


                  consoleContainer =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL
                      }


                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(statusText)

                  root.addView(
                      addConsoleButton
                  )

                  root.addView(
                      registerButton
                  )

                  root.addView(
                      settingsButton
                  )

                  root.addView(
                      refreshButton
                  )

                  root.addView(
                      consoleTitle
                  )

                  root.addView(
                      consoleContainer
                  )


                  scroll.addView(
                      root,
                      ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  setContentView(scroll)
              }


              private fun createButton(
                  title: String,
                  action: () -> Unit
              ): Button
              {
                  return Button(this).apply {

                      text = title

                      textSize = 15f

                      isAllCaps = false

                      setOnClickListener {
                          action()
                      }

                      val params =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(58)
                          )

                      params.setMargins(
                          0,
                          dp(6),
                          0,
                          dp(6)
                      )

                      layoutParams =
                          params
                  }
              }


              private fun loadConsolesSafely()
              {
                  statusText.text =
                      "Procurando consoles salvos..."

                  consoleContainer.removeAllViews()


                  Thread {

                      try
                      {
                          val db =
                              getDatabase(
                                  applicationContext
                              )


                          val manualHosts =
                              db
                                  .manualHostDao()
                                  .getAll()
                                  .firstOrError()
                                  .blockingGet()


                          val hosts =
                              mutableListOf<
                                  ManualHostAndRegisteredHost
                              >()


                          for(host in manualHosts)
                          {
                              try
                              {
                                  val complete =
                                      db
                                          .manualHostDao()
                                          .getByIdWithRegisteredHost(
                                              host.id
                                          )
                                          .blockingGet()

                                  hosts.add(
                                      complete
                                  )
                              }
                              catch(_: Throwable)
                              {
                              }
                          }


                          runOnUiThread {

                              renderConsoles(
                                  hosts
                              )
                          }
                      }
                      catch(t: Throwable)
                      {
                          runOnUiThread {

                              showError(
                                  "Banco de consoles",
                                  t
                              )
                          }
                      }

                  }.start()
              }


              private fun renderConsoles(
                  hosts:
                      List<
                          ManualHostAndRegisteredHost
                      >
              )
              {
                  consoleContainer.removeAllViews()


                  if(hosts.isEmpty())
                  {
                      statusText.text =
                          "Nenhum PS5 salvo. " +
                          "Use ADICIONAR PS5 POR IP."

                      return
                  }


                  statusText.text =
                      "${hosts.size} console(s) encontrado(s)."


                  for(item in hosts)
                  {
                      val manual =
                          item.manualHost

                      val registered =
                          item.registeredHost


                      val label =
                          if(registered != null)
                          {
                              val nickname =
                                  registered
                                      .serverNickname
                                      ?: "PS5"

                              "$nickname • ${manual.host}"
                          }
                          else
                          {
                              "Registrar • ${manual.host}"
                          }


                      val button =
                          createButton(
                              label
                          ) {

                              if(registered == null)
                              {
                                  registerManualHost(
                                      manual.id,
                                      manual.host
                                  )
                              }
                              else
                              {
                                  connectToConsole(
                                      item
                                  )
                              }
                          }


                      consoleContainer.addView(
                          button
                      )
                  }
              }


              private fun registerManualHost(
                  id: Long,
                  host: String
              )
              {
                  try
                  {
                      val intent =
                          Intent(
                              this,
                              RegistActivity::class.java
                          )


                      intent.putExtra(
                          RegistActivity.EXTRA_HOST,
                          host
                      )


                      intent.putExtra(
                          RegistActivity.EXTRA_BROADCAST,
                          false
                      )


                      intent.putExtra(
                          RegistActivity.EXTRA_ASSIGN_MANUAL_HOST_ID,
                          id
                      )


                      startActivity(
                          intent
                      )
                  }
                  catch(t: Throwable)
                  {
                      showError(
                          "Registro do PS5",
                          t
                      )
                  }
              }


              private fun connectToConsole(
                  item:
                      ManualHostAndRegisteredHost
              )
              {
                  val registered =
                      item.registeredHost
                          ?: return


                  try
                  {
                      statusText.text =
                          "Conectando a ${item.manualHost.host}..."


                      val preferences =
                          Preferences(this)


                      val connectInfo =
                          ConnectInfo(
                              registered.target.isPS5,
                              item.manualHost.host,
                              registered.rpRegistKey,
                              registered.rpKey,
                              preferences.videoProfile
                          )


                      val intent =
                          Intent(
                              this,
                              StreamActivity::class.java
                          )


                      intent.putExtra(
                          StreamActivity.EXTRA_CONNECT_INFO,
                          connectInfo
                      )


                      startActivity(
                          intent
                      )
                  }
                  catch(t: Throwable)
                  {
                      showError(
                          "Conexão Remote Play",
                          t
                      )
                  }
              }


              private fun showError(
                  area: String,
                  throwable: Throwable
              )
              {
                  val message =
                      throwable.message
                          ?: throwable
                              .javaClass
                              .simpleName


                  statusText.text =
                      "Erro em $area:\n$message"


                  statusText.setTextColor(
                      Color.rgb(
                          255,
                          130,
                          130
                      )
                  )
              }


              private fun showEmergencyScreen(
                  throwable: Throwable
              )
              {
                  val text =
                      TextView(this)


                  text.setBackgroundColor(
                      Color.rgb(
                          10,
                          7,
                          16
                      )
                  )


                  text.setTextColor(
                      Color.WHITE
                  )


                  text.textSize =
                      15f


                  text.setPadding(
                      dp(24),
                      dp(40),
                      dp(24),
                      dp(40)
                  )


                  text.text =
                      "ControllerX SAFE MODE\n\n" +
                      "A interface antiga falhou, " +
                      "mas o aplicativo permaneceu aberto.\n\n" +
                      throwable.javaClass.name +
                      "\n\n" +
                      (
                          throwable.message
                              ?: "Sem mensagem."
                      )


                  setContentView(
                      text
                  )
              }
          }
          KOTLIN

          echo "========================================"
          echo " CONTROLLERX MAIN CRASH HOTFIX"
          echo "========================================"

          grep -n \
            "class MainActivity" \
            upstream/android/app/src/main/java/com/metallic/chiaki/main/MainActivity.kt

          grep -n \
            "ControllerX iniciado com segurança" \
            upstream/android/app/src/main/java/com/metallic/chiaki/main/MainActivity.kt

          echo "MainActivity startup hotfix: OK"

      # ============================================================
      # VALIDAR SAFE BOOT
      # ============================================================

      - name: Validate Safe Boot source
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          echo "========================================"
          echo "VALIDANDO SAFE BOOT"
          echo "========================================"

          test -f \
            android/app/src/main/java/com/metallic/chiaki/safeboot/SafeBootActivity.kt

          grep -n \
            "discoveryEnabledKey, false" \
            android/app/src/main/java/com/metallic/chiaki/common/Preferences.kt

          grep -n \
            "it.active = false" \
            android/app/src/main/java/com/metallic/chiaki/main/MainViewModel.kt

          grep -n \
            "SafeBootActivity" \
            android/app/src/main/AndroidManifest.xml

          echo "Safe Boot source: OK"


      # ============================================================
      # OBOE / NDK 26
      # ============================================================

      - name: Fix old Oboe for Android NDK 26
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "android/app/src/main/cpp/oboe/src"
          )

          if not root.exists():
              raise SystemExit(
                  "Pasta Oboe nao encontrada."
              )

          patched = []

          for path in root.rglob(
              "*.cpp"
          ):

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if "assert(" not in text:
                  continue

              if "#include <cassert>" in text:
                  continue

              path.write_text(
                  "#include <cassert>\n" + text,
                  encoding="utf-8"
              )

              patched.append(
                  str(path)
              )

          print(
              "Arquivos Oboe corrigidos:",
              len(patched)
          )

          for path in patched:
              print(
                  "+",
                  path
              )
          PY

          echo "========================================"
          echo "OBOE"
          echo "========================================"

          for FILE in \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResampler.cpp \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResamplerMono.cpp \
            android/app/src/main/cpp/oboe/src/flowgraph/resampler/PolyphaseResamplerStereo.cpp
          do

            if [ -f "$FILE" ]; then

              grep -n \
                -E '#include <cassert>|assert\(' \
                "$FILE" \
                | head -20

            fi

          done


      # ============================================================
      # ANDROID 15 / 16 - 16 KB
      # ============================================================

      - name: Fix Android 15 and 16 native library compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          python3 - <<'PY'
          from pathlib import Path


          # ========================================================
          # CMAKE 16 KB
          # ========================================================

          cmake = Path(
              "android/app/CMakeLists.txt"
          )

          text = cmake.read_text(
              encoding="utf-8"
          )

          if (
              "max-page-size=16384"
              not in text
          ):

              text += r'''

          # ControllerX Android 16 KB
          target_link_options(
              chiaki-jni
              PRIVATE
              "-Wl,-z,max-page-size=16384"
          )

          '''

              cmake.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "CMake 16KB: OK"
          )


          # ========================================================
          # LEGACY JNI PACKAGING
          # ========================================================

          gradle = Path(
              "android/app/build.gradle"
          )

          text = gradle.read_text(
              encoding="utf-8"
          )

          if (
              "useLegacyPackaging = true"
              not in text
          ):

              marker = '''    buildFeatures {
          '''

              block = '''    packaging {
              jniLibs {
                  useLegacyPackaging = true
              }
          }

          '''

              if marker not in text:
                  raise SystemExit(
                      "buildFeatures nao encontrado."
                  )

              text = text.replace(
                  marker,
                  block + marker,
                  1
              )

              gradle.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "Legacy JNI packaging: OK"
          )


          # ========================================================
          # EXTRACT NATIVE LIBS
          # ========================================================

          manifest = Path(
              "android/app/src/main/"
              "AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:extractNativeLibs="true"'
              not in text
          ):

              marker = (
                  "<application"
              )

              position = text.find(
                  marker
              )

              if position < 0:
                  raise SystemExit(
                      "Application nao encontrada."
                  )

              end = position + len(
                  marker
              )

              text = (
                  text[:end]
                  +
                  '\n        android:extractNativeLibs="true"'
                  +
                  text[end:]
              )

              manifest.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "extractNativeLibs: OK"
          )
          PY


      # ============================================================
      # SALVAR DIFF
      # ============================================================

      - name: Save patched source diagnostics
        shell: bash
        run: |
          set -euo pipefail

          git -C upstream diff -- . \
            > controllerx-patched-source.diff

          echo "Source diff salvo."


      # ============================================================
      # LIMPAR CACHE CMAKE
      # ============================================================

      - name: Clean stale Android native build cache
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            upstream/android/app/.cxx

          rm -rf \
            upstream/android/app/build/intermediates/cxx

          echo "CMake cache limpo."


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd upstream/android

          chmod +x gradlew

          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          ./gradlew --version

          echo "========================================"
          echo "BUILD CONTROLLERX SAFE BOOT"
          echo "========================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            2>&1 \
            | tee \
            ../../controllerx-android-build.log


      # ============================================================
      # VALIDAR APK
      # ============================================================

      - name: Validate ControllerX APK
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "APK nao encontrado."

            exit 1

          fi

          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh "$APK"

          rm -rf \
            /tmp/controllerx-apk-check

          mkdir -p \
            /tmp/controllerx-apk-check

          unzip -p \
            "$APK" \
            lib/arm64-v8a/libchiaki-jni.so \
            > /tmp/controllerx-apk-check/libchiaki-jni.so

          if [ ! -s \
            /tmp/controllerx-apk-check/libchiaki-jni.so \
          ]; then

            echo "libchiaki-jni.so nao encontrada."

            exit 1

          fi

          echo "========================================"
          echo "ELF"
          echo "========================================"

          readelf -lW \
            /tmp/controllerx-apk-check/libchiaki-jni.so \
            | tee \
            controllerx-readelf-arm64.txt

          mapfile -t LOAD_ALIGNMENTS < <(
            readelf -lW \
              /tmp/controllerx-apk-check/libchiaki-jni.so \
              | awk '$1 == "LOAD" {print $NF}'
          )

          if [ \
            "${#LOAD_ALIGNMENTS[@]}" \
            -eq 0 \
          ]; then

            echo "Nenhum segmento LOAD encontrado."

            exit 1

          fi

          for ALIGN in \
            "${LOAD_ALIGNMENTS[@]}"
          do

            echo "LOAD: $ALIGN"

            ALIGN_DEC=$((ALIGN))

            if [ \
              "$ALIGN_DEC" \
              -lt 16384 \
            ]; then

              echo "ELF abaixo de 16 KB."

              exit 1

            fi

          done

          echo "========================================"
          echo "16 KB ELF OK"
          echo "========================================"

          unzip -lv \
            "$APK" \
            | grep \
            "lib/arm64-v8a/libchiaki-jni.so" \
            | tee \
            controllerx-apk-jni-entry.txt


      # ============================================================
      # VALIDAR SAFE BOOT DENTRO DO APK
      # ============================================================

      - name: Validate Safe Boot inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "VALIDANDO SAFE BOOT APK"
          echo "========================================"

          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"

          "$AAPT" dump badging "$APK" \
            | tee \
            controllerx-apk-badging.txt

          "$AAPT" dump xmltree \
            "$APK" \
            AndroidManifest.xml \
            | tee \
            controllerx-apk-manifest.txt

          grep -q \
            "SafeBootActivity" \
            controllerx-apk-manifest.txt

          echo "SafeBootActivity encontrada no APK."


      # ============================================================
      # PREPARAR APK FINAL
      # ============================================================

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/android/app/build/outputs/apk/debug/app-debug.apk"

          FINAL="ControllerX-Android-v3.3-SAFEBOOT.apk"

          test -f "$APK"

          cp \
            "$APK" \
            "$FINAL"

          sha256sum \
            "$FINAL" \
            | tee \
            ControllerX-Android-v3.3-SAFEBOOT.sha256

          echo "========================================"
          echo "APK FINAL"
          echo "========================================"

          ls -lh \
            "$FINAL"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload ControllerX APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-SAFEBOOT-APK
          path: |
            ControllerX-Android-v3.3-SAFEBOOT.apk
            ControllerX-Android-v3.3-SAFEBOOT.sha256
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # DIAGNOSTICOS
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ControllerX-Android-build-diagnostics
          path: |
            controllerx-android-build.log
            controllerx-patched-source.diff
            controllerx-readelf-arm64.txt
            controllerx-apk-jni-entry.txt
            controllerx-apk-badging.txt
            controllerx-apk-manifest.txt
          if-no-files-found: ignore
          retention-days: 14
