name: Build ControllerX Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone pinned Chiaki Android base
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/SalamiTheMan/chiaki-ng-android-extended.git upstream
          cd upstream
          git checkout 478a20eab9e55651ae77035764cf3138bd14084b
          git submodule update --init --recursive

      - name: Apply ControllerX v3.2 PRO MODS Android port
